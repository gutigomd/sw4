name: Print Software and DBMS Versions

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  PrintSoftwareVersions:
    name: Print Software Versions
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Display Python version
        run: python --version
      - name: Install project libraries
        run: python -m pip install mediapipe numpy
      - name: Display MediaPipe version
        run: python -c "import mediapipe; print('MediaPipe:', mediapipe.__version__)"
      - name: Display NumPy version
        run: python -c "import numpy; print('NumPy:', numpy.__version__)"

  PrintDBMSVersions:
    name: Print DBMS Versions
    runs-on: ubuntu-latest
    needs: [PrintSoftwareVersions]
    steps:
      - name: Install MongoDB
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org
      - name: Display MongoDB version
        run: mongod --version
